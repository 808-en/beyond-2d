<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond 2D - Prints</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="Logo.ico" type="image/x-icon">
    <link rel="shortcut icon" href="Logo.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="Logo.ico">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        .gradient-background { background: linear-gradient(to bottom right, #8B5CF6, #3B82F6, #10B981); }
        .modal-overlay { transition: opacity 0.3s ease-in-out; opacity: 0; pointer-events: none; z-index: 50; }
        .modal-overlay.is-open { opacity: 1; pointer-events: auto; }
        .modal-content { transform: translateY(-20px); opacity: 0; transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out; max-height: 90vh; overflow-y: auto; }
        .modal-overlay.is-open .modal-content { transform: translateY(0); opacity: 1; }
    </style>
    <script src="script.js"></script>
</head>
<body class="gradient-background text-white min-h-screen flex flex-col">

    <header class="w-full p-4 flex flex-col md:flex-row items-center justify-between sticky top-0 bg-gray-900 bg-opacity-80 z-40">
        <a href="index.html" class="text-white hover:text-gray-200 transition-colors duration-300 px-4 py-2 rounded-md mb-2 md:mb-0">
            &larr; Back to Home
        </a>
        <h1 class="text-4xl font-bold text-shadow-lg flex-grow text-center mb-2 md:mb-0">Our Prints</h1>
        <div class="flex space-x-4">
            <button id="viewCartBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-full transition-colors duration-300 shadow-lg">
                View Cart (<span id="cartItemCount">0</span>)
            </button>
        </div>
    </header>

    <section class="p-8 bg-gray-900 bg-opacity-70 rounded-b-lg shadow-xl mb-8 mx-auto w-11/12 md:w-full max-w-7xl">
        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6 items-end">
            <div class="col-span-full md:col-span-2 lg:col-span-2">
                <label for="searchBar" class="block text-lg font-semibold text-gray-200 mb-2">Search Items</label>
                <input type="text" id="searchBar" placeholder="Search by name or description..." class="w-full p-3 rounded-lg bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400 border border-gray-600">
            </div>

            <div>
                <label for="priceFilter" class="block text-lg font-semibold text-gray-200 mb-2">Filter by Price</label>
                <select id="priceFilter" class="w-full p-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="all">All Prices</option>
                    <option value="0-10">$0 - $10</option>
                    <option value="11-25">$11 - $25</option>
                    <option value="26-45">$26 - $45</option>
                    <option value="46-inf">$46+</option>
                </select>
            </div>

            <div>
                <label for="typeFilter" class="block text-lg font-semibold text-gray-200 mb-2">Filter by Type</label>
                <select id="typeFilter" class="w-full p-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="all">All Types</option>
                    <option value="pack">Pack</option>
                    <option value="sale">Sale</option>
                    <option value="normal">Normal</option>
                    <option value="deluxe pack">Deluxe Pack</option>
                </select>
            </div>
        </div>
    </section>

    <main class="flex-grow p-8">
        <div id="productsContainer" class="container mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        </div>
        <div id="noProductsMessage" class="hidden text-center text-xl text-gray-300 mt-10">
            No products found matching your criteria.
        </div>
    </main>

    <div id="productDetailsModal" class="modal-overlay fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center hidden">
        <div class="modal-content bg-white p-8 rounded-lg shadow-xl max-w-lg w-11/12 mx-auto relative text-gray-900">
            <button onclick="closeModal('productDetailsModal')" class="absolute top-4 right-4 text-gray-600 hover:text-gray-900 text-2xl font-bold">&times;</button>
            <h2 id="modalProductName" class="text-3xl font-bold mb-4"></h2>
            <img id="modalProductImage" src="" alt="Product Image" class="w-full h-48 object-cover rounded-lg mb-4">
            <p class="text-lg mb-2"><strong>Description:</strong> <span id="modalProductDescription"></span></p>
            <p class="text-lg mb-2"><strong>Size:</strong> <span id="modalProductSize"></span></p>
            <p class="text-lg mb-4"><strong>Price:</strong> $<span id="modalProductPrice"></span></p>
            <button id="modalAddToCartBtn" class="bg-blue-500 text-white font-bold py-2 px-4 rounded-full hover:bg-blue-600 transition-colors duration-300">Add to Cart</button>
        </div>
    </div>

    <div id="cartModal" class="modal-overlay fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center hidden">
        <div class="modal-content bg-white p-8 rounded-lg shadow-xl max-w-2xl w-11/12 mx-auto relative text-gray-900">
            <button onclick="closeModal('cartModal')" class="absolute top-4 right-4 text-gray-600 hover:text-gray-900 text-2xl font-bold">&times;</button>
            <h2 class="text-3xl font-bold mb-6">Your Cart</h2>
            <div id="cartItemsContainer" class="max-h-96 overflow-y-auto mb-6">
            </div>
            <div id="cartEmptyMessage" class="text-center text-lg text-gray-600 hidden">Your cart is empty.</div>
            <div class="flex justify-between items-center text-2xl font-bold pt-4 border-t border-gray-300">
                <span>Total:</span>
                <span>$<span id="cartTotal">0.00</span></span>
            </div>
            <div class="flex justify-end mt-8 space-x-4">
                <button onclick="closeModal('cartModal')" class="bg-gray-400 text-white font-bold py-3 px-6 rounded-full hover:bg-gray-500 transition-colors duration-300 shadow-md">
                    Continue Shopping
                </button>
                <button id="checkoutBtn" onclick="openCheckoutModal()" class="bg-green-600 text-white font-bold py-3 px-6 rounded-full hover:bg-green-700 transition-colors duration-300 shadow-md">
                    Checkout
                </button>
            </div>
        </div>
    </div>

    <div id="checkoutModal" class="modal-overlay fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center hidden">
        <div class="modal-content bg-gray-800 p-8 rounded-lg shadow-xl max-w-md w-11/12 mx-auto relative text-white">
            <button onclick="closeModal('checkoutModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
            <h2 class="text-3xl font-bold mb-6 text-center">Complete Your Order</h2>
            <form id="checkoutForm" class="space-y-4">
                <div>
                    <label for="cartUserName" class="block text-sm font-medium mb-1">Your Name</label>
                    <input type="text" id="cartUserName" class="w-full p-3 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white" required>
                </div>
                <div>
                    <label for="cartGroupName" class="block text-sm font-medium mb-1">Group / Identification</label>
                    <input type="text" id="cartGroupName" class="w-full p-3 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white" required>
                </div>
                <div>
                    <label for="cartTipChoice" class="block text-sm font-medium mb-1">Add Tip</label>
                    <select id="cartTipChoice" class="w-full p-3 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                        <option value="0.00">0.00</option>
                        <option value="1.00">1.00</option>
                        <option value="2.00">2.00</option>
                        <option value="5.00">5.00</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div id="cartCustomTipContainer" class="hidden">
                    <label for="cartCustomTip" class="block text-sm font-medium mb-1">Custom Tip Amount</label>
                    <input type="number" id="cartCustomTip" class="w-full p-3 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white" min="0.00" step="0.01">
                </div>
                <div class="pt-4 flex justify-between items-center text-xl font-bold border-t border-gray-700">
                    <span>Order Total:</span>
                    <span>$<span id="checkoutCartTotal">0.00</span></span>
                </div>
                <button type="submit" id="submitCheckoutBtn" class="w-full bg-green-600 text-white font-bold py-3 px-6 rounded-full hover:bg-green-700 transition-colors duration-300 shadow-md">
                    Submit Order
                </button>
            </form>
        </div>
    </div>

</body>
</html>
